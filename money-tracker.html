<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Money Tracker</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--line:#38383a;--tx:#fff;--mut:#8e8e93;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",sans-serif;padding-bottom:90px}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 0}
h1{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:8px 0 16px}
h2{font-size:13px;font-weight:600;color:var(--mut);margin:22px 8px 8px}
.card{background:var(--card);border-radius:var(--r);padding:16px}
.big{font-size:38px;font-weight:700;letter-spacing:-1px}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.g,.pos{color:var(--green)}.r,.neg{color:var(--red)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--line)}
.row:last-child{border:0}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--card2);flex:none}
.grow{flex:1;min-width:0}.grow b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;text-align:right}
.del{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 8px;cursor:pointer}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;display:flex;margin-top:10px}
.bar i{display:block;height:100%}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(28,28,30,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px)}
.tabs button{flex:1;max-width:160px;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:grid;gap:2px;justify-items:center;cursor:pointer}
.tabs button span{font-size:22px}.tabs .on{color:var(--blue)}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:56px;height:56px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:30px;box-shadow:0 6px 20px rgba(10,132,255,.4);cursor:pointer}
.seg{display:flex;background:var(--card2);border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:7px 4px;border-radius:7px;font:inherit;font-size:14px;cursor:pointer}
.seg .on{background:#636366;font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.panel h3{margin:0 0 14px;text-align:center;font-size:17px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 4px 4px}
input,select{width:100%;background:var(--card2);color:var(--tx);border:0;border-radius:10px;padding:12px;font:inherit;outline:none}
input:focus,select:focus{box-shadow:0 0 0 2px var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:18px;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--mut);margin-top:6px}
.link{background:none;border:0;color:var(--blue);font:inherit;font-size:13px;cursor:pointer;padding:4px}
.empty{padding:28px;text-align:center;color:var(--mut)}
#auth{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px}
#auth .card{width:100%;max-width:380px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}
</style>
</head>
<body>

<div id="auth"><div class="card">
  <h1 style="margin-top:0">Money Tracker</h1>
  <label>Email</label><input id="em" type="email" autocomplete="email">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="aerr"></div>
  <button class="btn" id="signin" style="margin-top:6px">Sign in</button>
  <button class="btn ghost" id="signup">Create account</button>
</div></div>

<div id="app" class="hide">
 <div class="wrap">
  <section id="v-home">
    <h1>Overview</h1>
    <div class="card"><div class="mut">Balance this month</div><div class="big" id="bal">₹0</div>
      <div class="grid" style="margin-top:14px"><div><div class="mut">Income</div><b class="g" id="inc">₹0</b></div><div><div class="mut">Spent</div><b class="r" id="exp">₹0</b></div></div></div>
    <h2>Spent by method</h2>
    <div class="card"><div class="bar" id="mbar"></div><div id="mleg" style="margin-top:12px"></div></div>
    <h2>Investments</h2>
    <div class="grid" style="margin-top:0"><div class="card"><div class="mut">Invested</div><b id="tinv">₹0</b></div><div class="card"><div class="mut">Expected value</div><b class="g" id="tmat">₹0</b></div></div>
    <h2>Upcoming maturities</h2><div class="list" id="upc"></div>
  </section>
  <section id="v-act" class="hide"><h1>Activity</h1>
    <div class="seg" id="mfilter"></div><div class="list" id="txl"></div></section>
  <section id="v-inv" class="hide"><h1>Investments</h1><div class="list" id="invl"></div>
    <button class="link" id="out" style="margin-top:24px">Sign out</button></section>
 </div>
 <button class="fab" id="fab" aria-label="Add">+</button>
 <nav class="tabs"><button data-t="home" class="on"><span>◔</span>Home</button><button data-t="act"><span>☰</span>Activity</button><button data-t="inv"><span>↗</span>Invest</button></nav>
</div>

<div class="sheet" id="s-tx"><div class="panel">
  <h3>New transaction</h3>
  <div class="seg" id="tx-type"><button data-v="expense" class="on">Expense</button><button data-v="income">Income</button></div>
  <label>Amount (₹)</label><input id="t-amt" type="number" inputmode="decimal">
  <div id="t-mwrap"><label>Paid via</label>
  <div class="seg" id="t-method"><button data-v="Cash" class="on">Cash</button><button data-v="UPI">UPI</button><button data-v="Credit card">Credit card</button></div></div>
  <div class="two"><div><label>Category</label><input id="t-cat" placeholder="Food, Salary…"></div><div><label>Date</label><input id="t-date" type="date"></div></div>
  <label>Note (optional)</label><input id="t-note">
  <button class="btn" id="t-save">Save transaction</button><button class="btn ghost" data-close>Cancel</button>
</div></div>

<div class="sheet" id="s-inv"><div class="panel">
  <h3>New investment</h3>
  <div class="seg" id="i-type"><button data-v="FD" class="on">FD</button><button data-v="RD">RD</button><button data-v="Stocks">Stocks</button><button data-v="MF">MF</button></div>
  <label>Name</label><input id="i-name" placeholder="SBI FD, Nifty 50 index fund…">
  <div class="two"><div><label id="i-amtl">Amount invested (₹)</label><input id="i-amt" type="number" inputmode="decimal"></div><div><label>Rate / expected return (% p.a.)</label><input id="i-rate" type="number" step="0.01" inputmode="decimal"></div></div>
  <div class="two"><div><label>Start date</label><input id="i-start" type="date"></div><div><label>Duration (months)</label><input id="i-dur" type="number" inputmode="numeric"></div></div>
  <label>Expected maturity amount (₹) <button class="link" id="i-calc" type="button">Auto-calculate</button></label><input id="i-mat" type="number" inputmode="decimal">
  <button class="btn" id="i-save">Save investment</button><button class="btn ghost" data-close>Cancel</button>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot,query,orderBy} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

// Firebase web config
const firebaseConfig = {
  apiKey: "AIzaSyBRXijLHMPy4KQLDFqngmcY_Mf1T3otYqY",
  authDomain: "money-tracker-b8198.firebaseapp.com",
  projectId: "money-tracker-b8198",
  storageBucket: "money-tracker-b8198.firebasestorage.app",
  messagingSenderId: "625072248691",
  appId: "1:625072248691:web:807fb6b4db1584a26a5706"
};

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const inr = n => "₹" + Math.round(n||0).toLocaleString("en-IN");
const today = () => new Date().toISOString().slice(0,10);
const ICON = {Cash:"💵",UPI:"📱","Credit card":"💳",income:"⬇",FD:"🏦",RD:"🗓",Stocks:"📈",MF:"🧺"};
const COL = {Cash:"#30d158",UPI:"#0a84ff","Credit card":"#ff9f0a"};
let uid, txs = [], invs = [], unsubs = [], mf = "All", tab = "home";

// ---------- auth ----------
const aerr = m => $("#aerr").textContent = m;
const cred = fn => () => fn(auth,$("#em").value.trim(),$("#pw").value).catch(e => aerr(e.code.replace("auth/","").replace(/-/g," ")));
$("#signin").onclick = cred(signInWithEmailAndPassword);
$("#signup").onclick = cred(createUserWithEmailAndPassword);
$("#out").onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = [];
  $("#auth").style.display = u ? "none" : "flex";
  $("#app").classList.toggle("hide", !u);
  if (!u) return;
  uid = u.uid;
  unsubs.push(onSnapshot(query(collection(db,"users",uid,"transactions"),orderBy("date","desc")), s => {txs = s.docs.map(d => ({id:d.id,...d.data()})); render();}));
  unsubs.push(onSnapshot(query(collection(db,"users",uid,"investments"),orderBy("maturityDate")), s => {invs = s.docs.map(d => ({id:d.id,...d.data()})); render();}));
});

// ---------- ui helpers ----------
function seg(el, cb){ el.onclick = e => { const b = e.target.closest("button"); if(!b) return; el.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); cb && cb(b.dataset.v); }; }
const segVal = el => el.querySelector(".on").dataset.v;
const open = id => $(id).classList.add("show"), close = () => $$(".sheet").forEach(s => s.classList.remove("show"));
$$("[data-close]").forEach(b => b.onclick = close);
$$(".sheet").forEach(s => s.onclick = e => { if (e.target === s) close(); });
$$(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; $$(".tabs button").forEach(x => x.classList.toggle("on", x === b)); ["home","act","inv"].forEach(t => $("#v-"+t).classList.toggle("hide", t !== tab)); });
$("#fab").onclick = () => {
  if (tab === "inv") { ["#i-name","#i-amt","#i-rate","#i-dur","#i-mat"].forEach(i => $(i).value = ""); $("#i-start").value = today(); open("#s-inv"); }
  else { ["#t-amt","#t-cat","#t-note"].forEach(i => $(i).value = ""); $("#t-date").value = today(); open("#s-tx"); }
};
seg($("#tx-type"), v => $("#t-mwrap").classList.toggle("hide", v === "income"));
seg($("#t-method")); 
seg($("#i-type"), v => $("#i-amtl").textContent = v === "RD" ? "Monthly deposit (₹)" : "Amount invested (₹)");

// ---------- save ----------
$("#t-save").onclick = async () => {
  const amount = +$("#t-amt").value; if (!amount) return;
  const type = segVal($("#tx-type"));
  await addDoc(collection(db,"users",uid,"transactions"), {type, amount, category:$("#t-cat").value.trim()||"General", date:$("#t-date").value||today(), note:$("#t-note").value.trim(), method: type==="expense" ? segVal($("#t-method")) : null});
  close();
};
function addMonths(d, m){ const x = new Date(d); x.setMonth(x.getMonth()+m); return x.toISOString().slice(0,10); }
function calc(){
  const t = segVal($("#i-type")), P = +$("#i-amt").value, r = +$("#i-rate").value, n = +$("#i-dur").value;
  if (!P || !n) return 0;
  if (t === "FD") return P * Math.pow(1 + r/400, 4*n/12);          // quarterly compounding
  if (t === "RD") { let s = 0; for (let i = 1; i <= n; i++) s += P * Math.pow(1 + r/400, 4*(n-i+1)/12); return s; }
  return P * Math.pow(1 + r/100, n/12);                              // Stocks / MF: yearly return
}
$("#i-calc").onclick = () => { const v = calc(); if (v) $("#i-mat").value = Math.round(v); };
$("#i-save").onclick = async () => {
  const type = segVal($("#i-type")), amount = +$("#i-amt").value, months = +$("#i-dur").value, start = $("#i-start").value || today();
  if (!amount || !months) return;
  const invested = type === "RD" ? amount * months : amount;
  await addDoc(collection(db,"users",uid,"investments"), {type, name:$("#i-name").value.trim()||type, amount, invested, rate:+$("#i-rate").value||0, months, startDate:start, maturityDate:addMonths(start,months), maturityAmount:+$("#i-mat").value || Math.round(calc())});
  close();
};
const del = (col,id) => confirm("Delete this entry?") && deleteDoc(doc(db,"users",uid,col,id));
window.delTx = id => del("transactions",id); window.delInv = id => del("investments",id);

// ---------- render ----------
function render(){
  const ym = today().slice(0,7), mt = txs.filter(t => t.date.startsWith(ym));
  const inc = mt.filter(t => t.type==="income").reduce((a,t) => a+t.amount,0);
  const ex = mt.filter(t => t.type==="expense"), exp = ex.reduce((a,t) => a+t.amount,0);
  $("#inc").textContent = inr(inc); $("#exp").textContent = inr(exp);
  const bal = inc-exp; $("#bal").textContent = (bal<0?"−":"")+inr(Math.abs(bal)); $("#bal").className = "big "+(bal<0?"neg":"");
  const by = {Cash:0,UPI:0,"Credit card":0}; ex.forEach(t => by[t.method] = (by[t.method]||0)+t.amount);
  $("#mbar").innerHTML = Object.entries(by).map(([k,v]) => `<i style="width:${exp?v/exp*100:0}%;background:${COL[k]||"#888"}"></i>`).join("");
  $("#mleg").innerHTML = Object.entries(by).map(([k,v]) => `<div style="display:flex;justify-content:space-between;padding:3px 0"><span><span style="color:${COL[k]}">●</span> ${k}</span><b>${inr(v)}</b></div>`).join("");
  $("#tinv").textContent = inr(invs.reduce((a,i) => a+i.invested,0));
  $("#tmat").textContent = inr(invs.reduce((a,i) => a+i.maturityAmount,0));
  const nowD = today(), up = invs.filter(i => i.maturityDate >= nowD).slice(0,3);
  $("#upc").innerHTML = up.length ? up.map(invRow).join("") : `<div class="empty">No upcoming maturities</div>`;
  const filters = ["All","Income","Cash","UPI","Credit card"];
  $("#mfilter").innerHTML = filters.map(f => `<button class="${f===mf?"on":""}" data-v="${f}">${f==="Credit card"?"Card":f}</button>`).join("");
  seg($("#mfilter"), v => { mf = v; render(); });
  const shown = txs.filter(t => mf==="All" || (mf==="Income" ? t.type==="income" : t.method===mf));
  $("#txl").innerHTML = shown.length ? shown.map(t => `<div class="row"><div class="ico">${t.type==="income"?ICON.income:ICON[t.method]}</div><div class="grow"><b>${esc(t.category)}</b><span class="mut">${t.date}${t.method?" · "+t.method:""}${t.note?" · "+esc(t.note):""}</span></div><div class="amt ${t.type==="income"?"pos":""}">${t.type==="income"?"+":"−"}${inr(t.amount)}</div><button class="del" onclick="delTx('${t.id}')">×</button></div>`).join("") : `<div class="empty">Nothing here yet. Tap + to add a transaction.</div>`;
  $("#invl").innerHTML = invs.length ? invs.map(i => invRow(i,true)).join("") : `<div class="empty">No investments yet. Tap + to add an FD, RD, stock or fund.</div>`;
}
function invRow(i, withDel){
  const gain = i.maturityAmount - i.invested;
  return `<div class="row"><div class="ico">${ICON[i.type]}</div><div class="grow"><b>${esc(i.name)}</b><span class="mut">${i.type} · ${i.rate}% · matures ${i.maturityDate}</span></div><div class="amt">${inr(i.maturityAmount)}<div class="mut pos">+${inr(gain)}</div></div>${withDel?`<button class="del" onclick="delInv('${i.id}')">×</button>`:""}</div>`;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
</script>
</body>
</html>
